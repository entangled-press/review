# GitHub Pages へのデプロイ。
# リポジトリが private の間は Pages を有効化できない（Freeプラン）ため、手動トリガーのみ。
# 公開後に Settings → Pages → Source を "GitHub Actions" にし、下の push トリガーを有効化する。
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
